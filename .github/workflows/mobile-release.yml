# Builds the signed Cairn APK and attaches it to a GitHub release.
# Runs when a tag like mobile-v1.0.1 is pushed:
#
#   git tag mobile-v1.0.1 && git push origin mobile-v1.0.1
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   MOBILE_KEYSTORE_BASE64    the output of: base64 -w0 mobile/keys/release.jks
#   MOBILE_KEYSTORE_PASSWORD  the storePassword line of mobile/keys/key.properties
name: Mobile release

on:
  push:
    tags: ['mobile-v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Version from the tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#mobile-v}" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the MOBILE_KEYSTORE_BASE64 and MOBILE_KEYSTORE_PASSWORD secrets first."
            exit 1
          fi
          mkdir -p mobile/keys
          echo "$KEYSTORE_BASE64" | base64 -d > mobile/keys/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=lou-apps"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > mobile/keys/key.properties

      - name: Analyze and test the shared package
        working-directory: mobile/packages/kit
        run: flutter pub get && flutter analyze && flutter test

      - name: Analyze and test Cairn
        working-directory: mobile/cairn
        run: flutter pub get && flutter analyze && flutter test

      - name: Build the APK
        working-directory: mobile/cairn
        # The build number must grow with every release or Android refuses the update.
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "$((GITHUB_RUN_NUMBER + 1))"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/cairn-${{ steps.version.outputs.name }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          name: Cairn mobile ${{ steps.version.outputs.name }}
          files: cairn-${{ steps.version.outputs.name }}.apk
          body: Open this page on the phone and tap the APK to install or update.
