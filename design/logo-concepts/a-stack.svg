<!-- Concept A, "Stack" (chosen): three hand-stacked pebbles, each set at a slight angle; the top one has a face. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cairn">
  <style>
    .base { fill: var(--logo-stone-base, #1c1b19); }
    .mid { fill: var(--logo-stone-middle, #a39e94); }
    .top { fill: var(--logo-stone-top, #f2a922); }
    .face { fill: var(--logo-face, #2a1d04); }
    .smile { fill: none; stroke: var(--logo-face, #2a1d04); stroke-width: 1.4; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .base { fill: var(--logo-stone-base, #f1efea); }
      .mid { fill: var(--logo-stone-middle, #6f6b63); }
      .top { fill: var(--logo-stone-top, #f5b13a); }
    }
  </style>
  <ellipse class="base" cx="32" cy="50" rx="24" ry="9.5"/>
  <ellipse class="mid" cx="30.5" cy="31.5" rx="17" ry="7.5" transform="rotate(-5 30.5 31.5)"/>
  <g transform="rotate(6 33 15)">
    <ellipse class="top" cx="33" cy="15" rx="11.5" ry="8.5"/>
    <circle class="face" cx="29.6" cy="14.2" r="1.35"/>
    <circle class="face" cx="36.4" cy="14.2" r="1.35"/>
    <path class="smile" d="M30.9 17.4 Q33 19.3 35.1 17.4"/>
  </g>
</svg>
