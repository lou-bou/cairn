<!-- Concept B, "Pebbles": straight pill-shaped stones stepped off-center; geometric, calmer. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cairn">
  <style>
    .base { fill: var(--logo-stone-base, #1c1b19); }
    .mid { fill: var(--logo-stone-middle, #a39e94); }
    .top { fill: var(--logo-stone-top, #f2a922); }
    .face { fill: var(--logo-face, #2a1d04); }
    .smile { fill: none; stroke: var(--logo-face, #2a1d04); stroke-width: 1.4; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .base { fill: var(--logo-stone-base, #f1efea); }
      .mid { fill: var(--logo-stone-middle, #6f6b63); }
      .top { fill: var(--logo-stone-top, #f5b13a); }
    }
  </style>
  <rect class="base" x="7" y="42" width="50" height="16" rx="8"/>
  <rect class="mid" x="15" y="26" width="32" height="13.5" rx="6.75"/>
  <rect class="top" x="22" y="7" width="22" height="16.5" rx="8.25"/>
  <circle class="face" cx="29.8" cy="14.6" r="1.35"/>
  <circle class="face" cx="36.2" cy="14.6" r="1.35"/>
  <path class="smile" d="M31 18 Q33 19.8 35 18"/>
</svg>
