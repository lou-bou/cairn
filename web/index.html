<!doctype html>
<html lang="en" data-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cairn</title>
    <meta
      name="description"
      content="Track money in and out toward a goal, one milestone at a time."
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
    <script>
      // Set the light/dark scheme before first paint, so a forced Appearance never flashes.
      (function () {
        var s = null;
        try {
          s = localStorage.getItem('cairn.scheme');
        } catch (e) {}
        var dark =
          s === 'dark' || (s !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.scheme = dark ? 'dark' : 'light';
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cairn" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Same shapes as components/Logo.tsx. Styled in styles/global.css, removed by lib/splash.ts. -->
    <div id="splash" class="splash" role="img" aria-label="Cairn is loading">
      <div class="splash-bg"></div>
      <svg class="splash-mark" viewBox="0 0 64 64" aria-hidden="true">
        <g class="splash-stone"><ellipse class="splash-base" cx="32" cy="50" rx="24" ry="9.5" /></g>
        <g class="splash-stone splash-stone-mid">
          <ellipse
            class="splash-mid"
            cx="30.5"
            cy="31.5"
            rx="17"
            ry="7.5"
            transform="rotate(-5 30.5 31.5)"
          />
        </g>
        <g class="splash-stone splash-stone-top">
          <g class="splash-hop">
            <g transform="rotate(6 33 15)">
              <ellipse class="splash-top" cx="33" cy="15" rx="11.5" ry="8.5" />
              <circle class="splash-face splash-eye" cx="29.6" cy="14.2" r="1.35" />
              <circle class="splash-face splash-eye" cx="36.4" cy="14.2" r="1.35" />
              <path class="splash-smile" d="M30.9 17.4 Q33 19.3 35.1 17.4" />
            </g>
          </g>
        </g>
      </svg>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
